<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi & Visualisasi Tabel Z</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
    
    <h1 class="text-2xl md:text-3xl font-bold text-center text-indigo-600 mb-2">
      Simulasi & Visualisasi Tabel Z
    </h1>
    <p class="text-center text-slate-500 mb-6 text-sm">
      Pelajari cara membaca Skor-Z dan area distribusinya secara interaktif.
    </p>

    <!-- Input Section -->
    <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6 bg-indigo-50 p-4 rounded-xl">
      <label for="zInput" class="font-semibold text-slate-700">Masukkan Nilai Z (-3.00 s/d 3.00):</label>
      <input 
        type="number" 
        id="zInput" 
        step="0.01" 
        min="-3.00" 
        max="3.00" 
        value="0.52" 
        class="w-32 px-3 py-2 border rounded-lg text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
      <input 
        type="range" 
        id="zSlider" 
        min="-3.00" 
        max="3.00" 
        step="0.01" 
        value="0.52" 
        class="w-full md:w-48 accent-indigo-600 cursor-pointer"
      >
    </div>

    <!-- Output Info -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 text-center">
      <div class="p-4 bg-slate-100 rounded-xl">
        <span class="block text-xs uppercase text-slate-400 font-bold">Koordinat Tabel</span>
        <span id="coordText" class="text-lg font-bold text-slate-700">Baris 0.5 | Kolom .02</span>
      </div>
      <div class="p-4 bg-indigo-100 rounded-xl">
        <span class="block text-xs uppercase text-indigo-500 font-bold">Probabilitas Area (Kiri)</span>
        <span id="resultText" class="text-xl font-extrabold text-indigo-700">0.69847 (69.85%)</span>
      </div>
    </div>

    <!-- Chart Canvas -->
    <div class="mb-6 h-64">
      <canvas id="zChart"></canvas>
    </div>

    <!-- Explanation Box -->
    <div id="explanation" class="p-4 bg-slate-50 border-l-4 border-indigo-500 rounded text-sm text-slate-600">
      <!-- Didiisi otomatis via JS -->
    </div>
  </div>

  <script>
    // Rumus aproksimasi Cumulative Distribution Function (CDF)
    function gnorm(z) {
      if (z < -6) return 0;
      if (z > 6) return 1;
      let b1 = 0.319381530, b2 = -0.356563782, b3 = 1.781477937, b4 = -1.821255978, b5 = 1.330274429;
      let p = 0.2316419;
      let c2 = 0.39894228;
      let a = Math.abs(z);
      let t = 1.0 / (1.0 + a * p);
      let b = c2 * Math.exp((-z * z) / 2.0);
      let n = ((((b5 * t + b4) * t + b3) * t + b2) * t + b1) * t;
      let area = 1.0 - b * n;
      return z < 0 ? 1.0 - area : area;
    }

    // Canvas Chart Setup
    const ctx = document.getElementById('zChart').getContext('2d');
    const labels = [];
    const dataPoints = [];
    for (let x = -3.5; x <= 3.5; x += 0.05) {
      labels.push(x.toFixed(2));
      dataPoints.push((1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x));
    }

    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Kurva Normal Standar',
          data: dataPoints,
          borderWidth: 2,
          borderColor: '#4f46e5',
          pointRadius: 0,
          fill: true,
          backgroundColor: (context) => {
            const chartArea = context.chart.chartArea;
            if (!chartArea) return null;
            const zVal = parseFloat(document.getElementById('zInput').value);
            const gradients = context.chart.ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
            
            // Map zVal (-3.5 s/d 3.5) ke persentase width canvas (0 s/d 1)
            let stopPos = (zVal + 3.5) / 7.0;
            stopPos = Math.max(0, Math.min(1, stopPos));

            gradients.addColorStop(0, 'rgba(79, 70, 229, 0.4)');
            gradients.addColorStop(stopPos, 'rgba(79, 70, 229, 0.4)');
            gradients.addColorStop(stopPos, 'rgba(226, 232, 240, 0.2)');
            gradients.addColorStop(1, 'rgba(226, 232, 240, 0.2)');
            return gradients;
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 15 } },
          y: { display: false }
        }
      }
    });

    // Update Logic
    function updateApp(val) {
      let z = parseFloat(val);
      if (isNaN(z)) z = 0;
      z = Math.min(3, Math.max(-3, z));

      const prob = gnorm(z);
      const percent = (prob * 100).toFixed(2);

      // Tangkap koordinat baris & kolom
      const sign = z < 0 ? "-" : "";
      const absZ = Math.abs(z);
      const rowVal = (Math.floor(absZ * 10) / 10).toFixed(1);
      const colVal = (Math.round((absZ - rowVal) * 100) / 100).toFixed(2).replace('0.', '.');

      document.getElementById('coordText').innerText = `Baris ${sign}${rowVal}  |  Kolom ${colVal}`;
      document.getElementById('resultText').innerText = `${prob.toFixed(5)} (${percent}%)`;
      document.getElementById('explanation').innerHTML = `
        <strong>Penjelasan:</strong><br>
        1. Angka $Z = ${z.toFixed(2)}$ dipecah menjadi baris <b>${sign}${rowVal}</b> dan kolom <b>${colVal}</b>.<br>
        2. Luas area terarsir di bawah kurva dari ujung kiri hingga titik $Z = ${z.toFixed(2)}$ adalah <b>${prob.toFixed(5)}</b>.<br>
        3. Artinya, sekitar <b>${percent}%</b> data berada di bawah nilai $Z$ ini.
      `;

      chart.update();
    }

    // Event Listeners
    const zInput = document.getElementById('zInput');
    const zSlider = document.getElementById('zSlider');

    zInput.addEventListener('input', (e) => {
      zSlider.value = e.target.value;
      updateApp(e.target.value);
    });

    zSlider.addEventListener('input', (e) => {
      zInput.value = e.target.value;
      updateApp(e.target.value);
    });

    // Initial render
    updateApp(0.52);
  </script>
</body>
</html>
